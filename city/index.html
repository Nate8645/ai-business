<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CITY · realtime</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0a0f1d;font-family:'Segoe UI',sans-serif}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas.grabbing{cursor:grabbing}
  /* ------------------------------------------------ */
  #hud{position:fixed;top:14px;left:14px;z-index:8;display:flex;align-items:flex-end;gap:10px;pointer-events:none}
  #brand{pointer-events:auto;background:rgba(10,16,30,.72);border:1px solid rgba(96,160,255,.35);border-radius:12px;
    padding:8px 14px;backdrop-filter:blur(6px)}
  #brand .t{color:#eaf3ff;font-weight:700;letter-spacing:1.5px;font-size:15px}
  #brand .s{color:#7fa8d8;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  #stats{pointer-events:none;background:rgba(10,16,30,.72);border:1px solid rgba(96,160,255,.25);border-radius:12px;
    padding:8px 14px;font-size:12px;color:#cfe2ff}
  #stats b{color:#5ee0ff}
  /* ------------------------------------------------ */
  #zoomtools{position:fixed;right:14px;bottom:90px;z-index:8;display:flex;flex-direction:column;gap:8px}
  #zoomtools button{width:38px;height:38px;border-radius:10px;background:rgba(16,24,42,.9);border:1px solid rgba(96,160,255,.4);
    color:#dfeeff;font-size:19px;cursor:pointer;line-height:1}
  #zoomtools button:hover{background:rgba(40,70,130,.9)}
  #zoomtools button.re{font-size:15px}
  /* ------------------------------------------------ */
  #cmd{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;
    background:rgba(10,16,30,.88);border:1px solid rgba(96,160,255,.35);border-radius:14px;padding:8px 12px;
    box-shadow:0 10px 34px rgba(0,0,0,.6);z-index:8}
  #cmd input{background:transparent;border:none;outline:none;color:#e4f0ff;font-size:14px;width:min(46vw,420px)}
  #cmd input::placeholder{color:#5b6c8c}
  #cmd button{background:linear-gradient(180deg,#1d4ed8,#12318f);border:1px solid #3b6ef0;color:#eaf2ff;border-radius:9px;
    padding:7px 14px;font-size:13px;cursor:pointer}
  #cmd button:hover{filter:brightness(1.2)}
  #cmd button:disabled{opacity:.45;cursor:wait}
  /* ------------------------------------------------ */
  #feed{position:fixed;right:14px;top:14px;width:280px;z-index:8;background:rgba(8,13,24,.78);border:1px solid rgba(96,160,255,.25);
    border-radius:12px;padding:8px 10px;max-height:38vh;overflow:hidden}
  #feed .fh{color:#6f92c4;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
  #feed .row{color:#bcd6ff;font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ------------------------------------------------ */
  #card{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);width:min(420px,92vw);z-index:9;
    background:rgba(10,16,30,.94);border:1px solid rgba(120,180,255,.5);border-radius:14px;padding:14px 16px;
    display:none;box-shadow:0 14px 50px rgba(0,0,0,.7);backdrop-filter:blur(8px)}
  #card .k{font-size:10px;letter-spacing:2px;color:#7fa8d8;text-transform:uppercase;margin-bottom:6px}
  #card .h{color:#f0f7ff;font-size:15px;font-weight:600;word-break:break-word}
  #card .b{color:#cfe2ff;font-size:12px;margin-top:6px;line-height:1.6}
  #card .b em{color:#5ee0ff;font-style:normal;font-weight:600}
  #card .b span{color:#8fb4d8}
  #card .x{position:absolute;right:10px;top:10px;border:none;background:transparent;color:#9db8d8;font-size:16px;cursor:pointer}
  #card .x:hover{color:#fff}
  /* ------------------------------------------------ */
  #hint{position:fixed;left:14px;bottom:16px;color:#5b6c8c;font-size:11px;pointer-events:none;z-index:6}
  #err{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#ff9d9d;font-size:14px;background:#221010;
    border:1px solid #f66;padding:16px 22px;border-radius:12px;display:none;z-index:10;max-width:70%;text-align:center}
</style>
</head>
<body>
<div id="err"></div>
<div id="hud">
  <div id="brand"><div class="t">AI&nbsp;CITY&nbsp;·&nbsp;realtime</div><div class="s">ai-business · agent-foundry</div></div>
  <div id="stats"><b id="ct">0</b> Gebäude · <b id="du">0</b> Stadtteile · <b id="au">0</b> UFOs aktiv</div>
</div>
<div id="zoomtools">
  <button id="zi">+</button>
  <button id="zo">−</button>
  <button id="zr" class="re">⤢</button>
</div>
<div id="feed"><div class="fh">Live-Feed</div></div>
<canvas id="cv"></canvas>
<div id="card">
  <button class="x" id="cx">✕</button>
  <div class="k" id="ck">Info</div>
  <div class="h" id="ch">–</div>
  <div class="b" id="cb">–</div>
</div>
<div id="cmd">
  <input id="in" placeholder="Auftrag an das Team · z.B. \"Analysiere das Repo und erstelle einen Überblick...\"" autocomplete="off">
  <button id="send">Agent starten</button>
</div>
<div id="hint">Scroll = Zoom · Drag = Pan · Doppelklick = Zentrieren · Klick auf UFO/Haus = Details</div>

<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var W = 0, H = 0;
  var DPR = Math.max(1, (window.devicePixelRatio || 1));
  function dpr() { return DPR; }
  function size() {
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', size); size();

  /* ---------------- isometrische Projektion ---------------- */
  var COS = Math.cos(Math.PI / 6), SIN = Math.sin(Math.PI / 6);
  function iso(x, z) { return { x: (x - z) * COS, y: (x + z) * SIN }; }

  /* ---------------- Kamera ---------------- */
  var cam = { cx: 0, cy: 0, z: 1 };   // Weltmittelpunkt in iso-Raum, z=zoom
  var drag = null, moved = false;

  function toScreen(p) {
    var s = iso(p.x - cam.cx, p.y - cam.cy);
    return { x: s.x * cam.z + W / 2, y: s.y * cam.z + H / 2 };
  }
  function toWorld(sx, sy) {
    var wx = (sx - W / 2) / cam.z, wy = (sy - H / 2) / cam.z;
    var x = (wx / COS + wy / SIN) / 2;
    var z = (wy / SIN - wx / COS) / 2;
    return { x: x + cam.cx, y: z + cam.cy };
  }
  function clampZ(v) { return Math.max(0.18, Math.min(6, v)); }
  /* Zoombild, das den Weltpunkt unter dem Mauspunkt exakt festhält */
  function zoomAt2(sx, sy, f) {
    var w = toWorld(sx, sy);
    var ox = sx - W / 2, oy = sy - H / 2;
    cam.z = clampZ(cam.z * f);
    var nz = cam.z;
    var ux = (ox / (COS * nz) + oy / (SIN * nz)) / 2;
    var uz = (oy / (SIN * nz) - ox / (COS * nz)) / 2;
    cam.cx = w.x - ux;
    cam.cy = w.y - uz;
  }

  /* ---------------- Daten ---------------- */
  var buildings = [];      // {rel, dist, ext, size, x, z, w, d, h, color}
  var dists = [];          // {name, x, z, w, d, color}
  var ufos = {};           // run -> ufo
  var events = [];
  var activeCount = 0;
  var cityMid = { x: 0, y: 0 };
  function centerCam() { cam.z = 1.15; cam.cx = cityMid.x; cam.cy = cityMid.y; }
  var BOX = 210;           // Weltabstand Stadtteil → Stadtteil
  var COLOR = ['#ffd75e','#5ee0ff','#5effa8','#c06bff','#ff8a5e','#ff5e9c','#6b8bff','#9dff5e','#ffb45e','#7aa6ff','#e05eff','#5efce8'];

  function distColor(name) {
    if (name === '.') return '#ffd75e';
    var h = 0; for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return COLOR[h % COLOR.length];
  }
  function distIndex(name) {
    for (var i = 0; i < dists.length; i++) if (dists[i].name === name) return i;
    return -1;
  }

  function buildCity(s) {
    /* Stadtteile anordnen: Grid */
    var names = s.dists.slice();
    var cols = Math.ceil(Math.sqrt(names.length));
    var per = {};
    s.buildings.forEach(function (b) { (per[b.dist] = per[b.dist] || []).push(b); });

    dists = [];
    var placed = {};
    names.forEach(function (nm, i) {
      var gx = (i % cols), gz = Math.floor(i / cols);
      var bx = gx * BOX, bz = gz * BOX;
      var bw = BOX - 22, bd = BOX - 22;
      var tmp = [];
      per[nm] = per[nm] || [];
      var nPerRow = Math.max(2, Math.floor(bw / 34));
      /* Gebäudehöhe = Größe der Datei */
      per[nm].forEach(function (b, k) {
        var cellW = bw / nPerRow, cellD = bd / (Math.ceil(per[nm].length / nPerRow));
        var px = Math.floor(k % nPerRow), pz = Math.floor(k / nPerRow);
        var x = bx + px * cellW + cellW / 2 - 6;
        var z = bz + pz * cellD + cellD / 2 - 6;
        var w = Math.max(8, cellW * 0.7), d = Math.max(8, cellD * 0.7);
        var h = 12 + Math.log2((b.size || 400) / 80 + 1) * 5;
        h = Math.min(90, Math.max(15, h));
        tmp.push({ rel: b.rel, dist: b.dist, ext: b.ext, size: b.size, x: x, z: z, w: w, d: d, h: h, color: distColor(b.dist) });
      });
      dists.push({ name: nm, x: bx, z: bz, w: bw, d: bd, color: distColor(nm), blds: tmp });
    });
    buildings = [];
    dists.forEach(function (d) { d.blds.forEach(function (b) { buildings.push(b); }); });

    /* Kamera initial auf Mitte */
    var maxX = 0, maxZ = 0;
    buildings.forEach(function (b) { if (b.x > maxX) maxX = b.x; if (b.z > maxZ) maxZ = b.z; });
    cam.cx = maxX / 2; cam.cy = maxZ / 2;
    cityMid = { x: maxX / 2, y: maxZ / 2 };
    cam.z = clampZ(Math.min(2.2, (H * 0.62) / (Math.max(maxX, maxZ) / 2)));
    document.getElementById('ct').textContent = buildings.length;
    document.getElementById('du').textContent = dists.length;
    document.getElementById('au').textContent = activeCount;
  }

  /* ---------------- UFO-Agenten ---------------- */
  function ensureUfo(a) {
    if (ufos[a.run]) { ufos[a.run].model = a.model || ufos[a.run].model; ufos[a.run].state = a.state || ufos[a.run].state; return; }
    var x = cam.cx + (Math.random() * 2 - 1) * 60;
    var z = cam.cy + (Math.random() * 2 - 1) * 60;
    ufos[a.run] = { run: a.run, model: a.model || '?', state: a.state || 'idle', steps: a.steps || 0, tools: a.tools || 0,
      file: a.file, x: x, z: z, vx: 0.35, vz: 0.3, bob: Math.random() * 6.28, targetB: null, color: distColor((a.model||'x').length % COLOR.length + '') };
  }
  function applyUfo(u, a) {
    u.model = a.model || u.model;
    u.state = a.state || u.state;
    if (a.steps !== undefined) u.steps = a.steps;
    if (a.tools !== undefined) u.tools = a.tools;
    if (a.file && a.file !== u.file) { u.file = a.file; u.pulse = performance.now(); }
    if (u.file) {
      for (var i = 0; i < buildings.length; i++) if (buildings[i].rel === u.file) { u.targetB = buildings[i]; break; }
    }
  }

  /* ---------------- Zeichnen: Stadt ---------------- */
  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    var r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    if (f < 1) { r *= f; g *= f; b *= f; } else { r += (255 - r) * (f - 1); g += (255 - g) * (f - 1); b += (255 - b) * (f - 1); }
    return 'rgb(' + (r | 0) + ',' + (g | 0) + ',' + (b | 0) + ')';
  }

  function drawBuilding(g) {
    var cx = g.x, cz = g.z, w = g.w, d = g.d, h = g.h;
    function sp(x, z) { var s = iso(x - cam.cx, z - cam.cy); return { x: s.x * cam.z + W / 2, y: s.y * cam.z + H / 2 }; }
    var lift = h * 0.5 * cam.z;
    var c0 = sp(cx - w / 2, cz - d / 2), c1 = sp(cx + w / 2, cz - d / 2);
    var c2 = sp(cx + w / 2, cz + d / 2), c3 = sp(cx - w / 2, cz + d / 2);
    /* Seitenwände */
    /* rechte Wand (+x, Kante c1-c2), dunkler */
    ctx.beginPath();
    ctx.moveTo(c1.x, c1.y); ctx.lineTo(c1.x, c1.y - lift);
    ctx.lineTo(c2.x, c2.y - lift); ctx.lineTo(c2.x, c2.y);
    ctx.closePath();
    ctx.fillStyle = shade(g.color, 0.5); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 0.6; ctx.stroke();
    /* vordere Wand (+z, Kante c3-c2), heller */
    ctx.beginPath();
    ctx.moveTo(c3.x, c3.y); ctx.lineTo(c3.x, c3.y - lift);
    ctx.lineTo(c2.x, c2.y - lift); ctx.lineTo(c2.x, c2.y);
    ctx.closePath();
    ctx.fillStyle = shade(g.color, 0.78); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.lineWidth = 0.6; ctx.stroke();
    /* Fenster auf der vorderen Wand */
    if (lift > 9) {
      ctx.fillStyle = 'rgba(235,246,255,.9)';
      var nW = Math.max(1, Math.floor(w / 6)), nH = Math.max(1, Math.floor(lift / 18));
      for (var i = 0; i < nW; i++) {
        for (var j = 0; j < nH; j++) {
          if ((i + j * 2) % 4 !== 0) {
            var f = (i + 0.5) / nW;
            var wx = c3.x + (c2.x - c3.x) * f, wy = c3.y + (c2.y - c3.y) * f;
            ctx.fillRect(wx - 1.5 * cam.z, wy - lift + j * 17 + 6, Math.max(2, 3 * cam.z), Math.max(3, 5 * cam.z));
          }
        }
      }
    }
    /* Dach */
    ctx.beginPath();
    ctx.moveTo(c0.x, c0.y - lift); ctx.lineTo(c1.x, c1.y - lift);
    ctx.lineTo(c2.x, c2.y - lift); ctx.lineTo(c3.x, c3.y - lift);
    ctx.closePath();
    ctx.fillStyle = shade(g.color, 1.08); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.stroke();
    /* Antenne auf Wolkenkratzern */
    if (g.size > 20000) {
      var mx = (c0.x + c2.x) / 2, my = (c0.y + c2.y) / 2 - lift;
      ctx.fillStyle = '#9ab8ff';
      ctx.fillRect(mx - 1, my - 18 * cam.z, 2, 18 * cam.z);
      ctx.fillStyle = '#ff5577';
      ctx.beginPath(); ctx.arc(mx, my - 19 * cam.z, 2.2 * cam.z, 0, 7); ctx.fill();
    }
  }

  function drawUfo(u, now) {
    var px = iso(u.x, u.z);
    var lift = 26 * cam.z + 6;
    var sx = px.x * cam.z + W / 2, sy = px.y * cam.z + H / 2 - lift;
    var bobY = Math.sin(u.bob) * 3; sy += bobY;

    /* Schatten auf dem Boden */
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(px.x * cam.z + W / 2, px.y * cam.z + H / 2, 16 * cam.z, 5 * cam.z, 0, 0, 6.29);
    ctx.fill();

    /* Lichtkegel auf Zielgebäude */
    if (u.targetB) {
      var tp = iso(u.targetB.x, u.targetB.z);
      var tx = tp.x * cam.z + W / 2, ty = tp.y * cam.z + H / 2 - (u.targetB.h * 0.32) * cam.z - 6;
      ctx.strokeStyle = 'rgba(255,235,150,.5)';
      ctx.lineWidth = 1.2 * cam.z;
      ctx.beginPath();
      ctx.moveTo(sx, sy); ctx.lineTo(tx, ty + 10 * cam.z);
      ctx.stroke();
    }

    /* Untertasse */
    ctx.fillStyle = 'rgba(40,60,110,.95)';
    ctx.beginPath(); ctx.ellipse(sx, sy + 3, 16 * cam.z, 6 * cam.z, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(70,100,180,.95)';
    ctx.beginPath(); ctx.ellipse(sx, sy + 2, 12 * cam.z, 4.5 * cam.z, 0, 0, 6.29); ctx.fill();
    /* Glaskuppel */
    ctx.fillStyle = 'rgba(160,220,255,.85)';
    ctx.beginPath(); ctx.arc(sx, sy - 2, 10 * cam.z, Math.PI, 2 * Math.PI); ctx.fill();
    /* Leuchtring */
    ctx.fillStyle = 'rgba(120,255,220,.85)';
    ctx.beginPath(); ctx.ellipse(sx, sy + 1, 15 * cam.z, 3.5 * cam.z, 0, 0, 6.29); ctx.fill();
    /* Label */
    var txt = (u.model === '?' ? 'agent' : u.model);
    ctx.font = Math.max(10, 11 * cam.z) + 'px Segoe UI, sans-serif';
    var tw = ctx.measureText(txt).width;
    ctx.fillStyle = 'rgba(8,14,26,.8)';
    ctx.fillRect(sx - tw / 2 - 6, sy - 24 * cam.z - 14, tw + 12, 16);
    ctx.fillStyle = u.targetB ? '#ffe9a8' : '#cfe0ff';
    ctx.fillText(txt, sx - tw / 2, sy - 24 * cam.z - 2);
  }

  /* ---------------- Kamera-gerechtes Zeichnen ---------------- */
  function drawScene(now) {
    ctx.fillStyle = '#0a0f1d';
    ctx.fillRect(0, 0, W, H);

    /* Boden-Grid um Zentrum */
    var vis = Math.max(W, H) / cam.z + 40;
    ctx.strokeStyle = 'rgba(80,130,220,.10)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    var gx0 = Math.floor(cam.cx - vis), gx1 = Math.floor(cam.cx + vis);
    var gz0 = Math.floor(cam.cy - vis), gz1 = Math.floor(cam.cy + vis);
    for (var gx = gx0; gx <= gx1; gx++) {
      var a = iso(gx, gz0), b = iso(gx, gz1);
      ctx.moveTo(a.x * cam.z + W / 2, a.y * cam.z + H / 2);
      ctx.lineTo(b.x * cam.z + W / 2, b.y * cam.z + H / 2);
    }
    for (var gz = gz0; gz <= gz1; gz++) {
      var c = iso(gx0, gz), d = iso(gx1, gz);
      ctx.moveTo(c.x * cam.z + W / 2, c.y * cam.z + H / 2);
      ctx.lineTo(d.x * cam.z + W / 2, d.y * cam.z + H / 2);
    }
    ctx.stroke();

    /* Straßen-Raster zwischen den Stadtteilen */
    ctx.fillStyle = 'rgba(42,56,92,.75)';
    var rw = BOX * 0.09;
    var kX0 = Math.floor((cam.cx - vis) / BOX), kX1 = Math.ceil((cam.cx + vis) / BOX);
    var kZ0 = Math.floor((cam.cy - vis) / BOX), kZ1 = Math.ceil((cam.cy + vis) / BOX);
    for (var kx = kX0; kx <= kX1; kx++) {
      var X = kx * BOX;
      var r1 = iso(X - rw, cam.cy - vis), r2 = iso(X + rw, cam.cy - vis);
      var r3 = iso(X + rw, cam.cy + vis), r4 = iso(X - rw, cam.cy + vis);
      ctx.beginPath();
      ctx.moveTo(r1.x * cam.z + W / 2, r1.y * cam.z + H / 2);
      ctx.lineTo(r2.x * cam.z + W / 2, r2.y * cam.z + H / 2);
      ctx.lineTo(r3.x * cam.z + W / 2, r3.y * cam.z + H / 2);
      ctx.lineTo(r4.x * cam.z + W / 2, r4.y * cam.z + H / 2);
      ctx.closePath(); ctx.fill();
    }
    for (var kz = kZ0; kz <= kZ1; kz++) {
      var Z = kz * BOX;
      var s1 = iso(cam.cx - vis, Z - rw), s2 = iso(cam.cx - vis, Z + rw);
      var s3 = iso(cam.cx + vis, Z + rw), s4 = iso(cam.cx + vis, Z - rw);
      ctx.beginPath();
      ctx.moveTo(s1.x * cam.z + W / 2, s1.y * cam.z + H / 2);
      ctx.lineTo(s2.x * cam.z + W / 2, s2.y * cam.z + H / 2);
      ctx.lineTo(s3.x * cam.z + W / 2, s3.y * cam.z + H / 2);
      ctx.lineTo(s4.x * cam.z + W / 2, s4.y * cam.z + H / 2);
      ctx.closePath(); ctx.fill();
    }

    /* Stadtteil-Bodenplatten (Iso-Rauten) */
    dists.forEach(function (d) {
      var q = [
        iso(d.x, d.z + d.d / 2),
        iso(d.x + d.w / 2, d.z + d.d),
        iso(d.x + d.w, d.z + d.d / 2),
        iso(d.x + d.w / 2, d.z)
      ];
      ctx.beginPath();
      ctx.moveTo(q[0].x * cam.z + W / 2, q[0].y * cam.z + H / 2);
      for (var i = 1; i < q.length; i++) ctx.lineTo(q[i].x * cam.z + W / 2, q[i].y * cam.z + H / 2);
      ctx.closePath();
      ctx.fillStyle = 'rgba(17,25,43,.96)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(120,170,255,.22)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });

    /* Gebäude nach Entfernung sortieren (far zuerst) */
    var order = buildings.slice().sort(function (a, b) { return (a.x + a.z) - (b.x + b.z); });
    order.forEach(function (g) { drawBuilding(g); });

    /* Stadtteil-Namen */
    ctx.font = Math.max(10, 11 * cam.z) + 'px Segoe UI';
    dists.forEach(function (d) {
      var p = iso(d.x + d.w / 2, d.z + d.d + 6);
      var sx = p.x * cam.z + W / 2, sy = p.y * cam.z + H / 2;
      ctx.fillStyle = d.color;
      ctx.font = Math.max(10, 11 * cam.z) + 'px Segoe UI';
      ctx.textAlign = 'center';
      ctx.fillText((d.name === '.' ? 'ROOT' : d.name).toUpperCase(), sx, sy);
      ctx.textAlign = 'left';
    });

    /* UFOs */
    var ua = Object.keys(ufos);
    activeCount = 0;
    ua.forEach(function (k) {
      var u = ufos[k];
      if (!u.targetB && buildings.length > 0) {
        /* landen lassen auf zufälligem Gebäude wenn arbeitend */
        if (u.state === 'working' && Math.random() < 0.03) u.targetB = buildings[(Math.random() * buildings.length) | 0];
      }
      if (Math.random() < 0.012) { u.vx = (Math.random() * 2 - 1) * 0.55; u.vz = (Math.random() * 2 - 1) * 0.55; }
      u.x += u.vx; u.z += u.vz;
      u.bob += 0.05;
      if (u.state !== 'done') activeCount++;
      drawUfo(u, now);
    });
    document.getElementById('au').textContent = activeCount;
  }

  /* ---------------- Live-Feed & Card ---------------- */
  function push(txt, col) {
    events.unshift({ t: Date.now(), txt: txt, col: col || '#bcd6ff' });
    if (events.length > 40) events.pop();
    renderFeed();
  }
  function renderFeed() {
    var el = document.getElementById('feed');
    var html = '<div class="fh">Live-Feed</div>';
    var show = events.slice(0, 14);
    show.forEach(function (e) { html += '<div class="row" style="color:' + e.col + '">' + e.txt + '</div>'; });
    el.innerHTML = html;
  }

  var selUfo = null;
  function openUfo(u) {
    selUfo = u;
    var host = 'agent/' + (u.model || '?');
    var f = u.file ? u.file : '(wartet auf Arbeit)';
    document.getElementById('ck').textContent = 'UFO · live session';
    document.getElementById('ch').textContent = host;
    document.getElementById('cb').innerHTML =
      '<em>' + (u.state || 'idle') + '</em><br>' +
      '<span>Schritte:</span> ' + u.steps + ' · <span>Tools:</span> ' + u.tools + '<br>' +
      '<span>Aktuelle Datei:</span> ' + f;
    document.getElementById('card').style.display = 'block';
  }
  var selBld = null;
  function openBld(g) {
    document.getElementById('ck').textContent = 'HAUS · datei';
    document.getElementById('ch').textContent = g.rel;
    document.getElementById('cb').innerHTML =
      '<em>Datei in der City</em><br>' +
      '<span>Größe:</span> ' + (g.size / 1024).toFixed(1) + ' kB · <span>Höhe:</span> ' + g.h.toFixed(0) + 'm<br>' +
      '<span>Stadtteil:</span> ' + (g.dist === '.' ? 'ROOT' : g.dist);
    document.getElementById('card').style.display = 'block';
  }
  function closeCard() { document.getElementById('card').style.display = 'none'; selUfo = null; selBld = null; }

  /* ---------------- Picking ---------------- */
  function pick(sx, sy) {
    /* UFOs zuerst */
    var best = null, bd = 1e9;
    Object.keys(ufos).forEach(function (k) {
      var u = ufos[k];
      var p = iso(u.x, u.z);
      var lift = 26 * cam.z + 6;
      var ux = p.x * cam.z + W / 2, uy = p.y * cam.z + H / 2 - lift + Math.sin(u.bob) * 3;
      var d = Math.hypot(sx - ux, sy - uy);
      if (d < 60 && d < bd) { bd = d; best = u; }
    });
    if (best) { openUfo(best); return; }
    /* Gebäude */
    var order = buildings.slice().sort(function (a, b) { return (b.x + b.z) - (a.x + a.z); });
    for (var i = 0; i < order.length; i++) {
      var g = order[i];
      var a = iso(g.x - g.w / 2, g.z - g.d / 2), b = iso(g.x + g.w / 2, g.z + g.d / 2);
      var x0 = Math.min(a.x * cam.z + W / 2, b.x * cam.z + W / 2) - 2;
      var y0 = Math.min(a.y * cam.z + H / 2 - g.h * 0.32 * cam.z - 2, b.y * cam.z + H / 2 - g.h * 0.32 * cam.z - 2);
      var x1 = Math.max(a.x * cam.z + W / 2, b.x * cam.z + W / 2) + 2;
      var y1 = b.y * cam.z + H / 2 + 2;
      if (sx >= x0 && sx <= x1 && sy >= y0 && sy <= y1) { openBld(g); return; }
    }
    closeCard();
  }

  /* ---------------- SSE + Dispatch ---------------- */
  function showErr(m) { var e = document.getElementById('err'); e.style.display = 'block'; e.textContent = m; }
  function connect() {
    fetch('/api/state').then(function (r) { return r.json(); }).then(function (s) {
      buildCity(s);
      s.agents.forEach(function (a) { if (a.state !== 'done') { ensureUfo(a); applyUfo(ufos[a.run], a); } });
      push('◉ City mit ' + buildings.length + ' Gebäuden geladen', '#9dff5e');
    }).catch(function () { showErr('Server nicht erreichbar – starte:  node city/server.js  (Port 4777)'); });
    var es = new EventSource('/api/events');
    es.onerror = function () {};
    es.onmessage = function (m) {
      var ev; try { ev = JSON.parse(m.data); } catch (e) { return; }
      handle(ev);
    };
  }
  function handle(ev) {
    if (ev.type === 'dispatch_start') { push('⇧ Agent gestartet: ' + (ev.prompt || '').slice(0, 60), '#ffe9a8'); }
    if (ev.type === 'dispatch_failed') { push('⚠ ' + (ev.msg || 'dispatch fehlgeschlagen'), '#ff9d9d'); }
    if (!ev.agent) return;
    var u = ufos[ev.agent.run];
    if (ev.type === 'agent_model' && u) { u.model = ev.agent.model || u.model; }
    if (ev.type === 'agent_seen') { ensureUfo(ev.agent); u = ufos[ev.agent.run]; push('◉ neuer Agent registriert (modell folgt)', '#9dff5e'); }
    if (ev.type === 'agent_stream') { if (u) u.state = 'thinking'; }
    if (ev.type === 'agent_process') { if (u) { u.tools++; u.state = 'tools'; } }
    if (ev.type === 'agent_step') {
      if (u) { u.steps = Math.max(u.steps || 0, (ev.agent.steps || 0)); u.state = 'working'; }
    }
    if (ev.type === 'agent_touch') {
      if (u) { applyUfo(u, ev.agent); push('◉ ' + (u.model || 'agent') + ' · ' + (ev.agent.file || ''), '#5ee0ff'); }
    }
    if (ev.type === 'agent_done') { if (u) { u.state = 'done'; push('✔ Agent fertig: ' + (u.model || ''), '#9dff5e'); } }
    if (ev.type === 'agent_error') { if (u) push('⚠ ' + (u.model || '') + ' fehler', '#ff9d9d'); }
  }

  /* ---------------- Input ---------------- */
  var sending = false;
  function send() {
    var v = document.getElementById('in').value.trim();
    if (!v || sending) return;
    sending = true;
    var btn = document.getElementById('send'); btn.disabled = true;
    fetch('/api/dispatch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: v, agent: 'build' }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) push('⚠ ' + (j.err || 'fehler'), '#ff9d9d'); else { push('⇧ Auftrag an das Team geschickt', '#9dff5e'); document.getElementById('in').value = ''; } })
      .catch(function () { push('⚠ Server nicht erreichbar', '#ff9d9d'); })
      .then(function () { sending = false; btn.disabled = false; });
  }

  /* ---------------- Loop + Interaktion ---------------- */
  function setup() {
    document.getElementById('send').addEventListener('click', send);
    document.getElementById('in').addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
    document.getElementById('cx').addEventListener('click', closeCard);
    document.getElementById('zi').addEventListener('click', function () { zoomAt2(W / 2, H / 2, 1.35); });
    document.getElementById('zo').addEventListener('click', function () { zoomAt2(W / 2, H / 2, 0.74); });
    document.getElementById('zr').addEventListener('click', centerCam);

    cv.addEventListener('pointerdown', function (e) {
      drag = { x: e.clientX, y: e.clientY, cx: cam.cx, cy: cam.cy };
      moved = false;
      cv.classList.add('grabbing');
    });
    window.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (moved) {
        cam.cx = drag.cx - dx / cam.z / COS;
        cam.cy = drag.cy - dy / cam.z / SIN;
      }
    });
    window.addEventListener('pointerup', function (e) {
      if (drag && !moved) pick(e.clientX, e.clientY);
      drag = null; cv.classList.remove('grabbing');
    });
    cv.addEventListener('wheel', function (e) {
      e.preventDefault();
      zoomAt2(e.clientX, e.clientY, e.deltaY < 0 ? 1.18 : 0.85);
    }, { passive: false });
    cv.addEventListener('dblclick', centerCam);

    window.addEventListener('keydown', function (e) {
      if (e.key === '+' || e.key === '=') zoomAt2(W / 2, H / 2, 1.35);
      if (e.key === '-') zoomAt2(W / 2, H / 2, 0.74);
      if (e.key === '0' || e.key === 'r') centerCam();
    });

    function loop(now) {
      drawScene(now);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  connect();
  setup();
})();
</script>
</body>
</html>
