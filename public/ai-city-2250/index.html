<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUNA CITY 2250 · Holografisches System</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#02030a}
  canvas{display:block;width:100%;height:100%;cursor:default}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% 20%,#0c1440,#02030a);color:#9fb8d8;font-family:'Segoe UI',sans-serif;z-index:5}
  #boot .lbl{font-size:13px;letter-spacing:3px;color:#7df0ff;text-transform:uppercase}
</style>
</head>
<body>
<div id="boot">
  <div class="lbl">LUNA CITY 2250 lädt …</div>
</div>
<canvas id="game"></canvas>

<script src="roster.js"></script>
<script src="sim.js"></script>
<script src="world.js"></script>
<script src="ui.js"></script>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('game');
  var boot = document.getElementById('boot');

  if (!window.SIM || !window.WORLD || !window.UI) {
    boot.innerHTML = '<div style="color:#ff8f7b;font-size:14px">Lade-Fehler: Module fehlen</div>';
    return;
  }

  window.WORLD.init(cv);
  window.UI.init(cv);
  boot.style.display = 'none';

  var SIM = window.SIM, WORLD = window.WORLD, UI = window.UI;

  /* ---- Eingabe: Pan / Zoom / Klick ---- */
  var drag = false, moved = false, lx = 0, ly = 0;

  cv.addEventListener('pointerdown', function (e) {
    lx = e.offsetX; ly = e.offsetY;
    drag = true; moved = false;
  });

  cv.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var z = WORLD.zoomFactor();
    var dx = e.offsetX - lx, dy = e.offsetY - ly;
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    WORLD.panBy(-dx / z, -dy / z);
    lx = e.offsetX; ly = e.offsetY;
  });

  cv.addEventListener('pointerup', function (e) {
    if (drag && !moved) handleClick(e.offsetX, e.offsetY);
    drag = false;
  });

  cv.addEventListener('pointercancel', function () { drag = false; });

  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    var dy = e.deltaY || 0;
    if (UI.wheel(e.offsetX, e.offsetY, dy)) return;
    if (!drag) WORLD.zoomAt(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.12 : 0.89);
  }, { passive: false });

  cv.addEventListener('dblclick', function () { WORLD.resetCam(); });

  function handleClick(ex, ey) {
    var hit = UI.hitTest(ex, ey);

    if (hit && hit.t === 'button-action') { /* reserved */ }

    if (hit) {
      if (hit.t === 'tab') { UI.setTab(hit.id); return; }
      if (hit.t === 'div') { UI.toggleDivision(hit.di); return; }
      if (hit.t === 'row') { if (hit.agent) UI.selectAgent(hit.agent); return; }
      if (hit.t === 'close') { UI.closeDetail(); return; }
      if (hit.t === 'btn') {
        if (hit.id === 'pause') { SIM.paused = !SIM.paused; UI.toast(SIM.paused ? '⏸ Simulation pausiert' : '▶ Simulation läuft'); }
        else if (hit.id === 'launch') { SIM.launchMission(); UI.toast('🚀 Mission gestartet'); }
        else if (hit.id === 'build') { SIM.buildProject(); UI.toast('🏗 Ausbau gestartet'); }
        else if (hit.id === 'reset') { SIM.reset(); UI.toast('⟲ Kolonie zurückgesetzt'); }
        return;
      }
      if (hit.t === 'chip') {
        UI.toast('Statistik · hol dir mehr Projekte!');
        return;
      }
      /* 'clear' oder 'card' -> zuerst Welt-Agent treffen */
    }

    var agent = WORLD.hitAgent(ex, ey);
    if (agent) { UI.selectAgent(agent); }
    else { UI.closeDetail(); }
  }

  /* ---- Haupt-Loop ---- */
  var last = SIM.now();
  function loop(nowT) {
    var dt = Math.min(0.08, (nowT - last) / 1000);
    last = nowT;
    SIM.tick(dt);
    SIM.missionTick(dt);
    WORLD.render(nowT);
    UI.render(nowT);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
